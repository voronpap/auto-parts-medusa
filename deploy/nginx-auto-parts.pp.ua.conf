server {
    server_name auto-parts.pp.ua;

    client_max_body_size 25m;

    location = / {
        root /var/www/auto-parts;
        try_files /themes.html =404;
        add_header Cache-Control "no-cache";
    }

    location = /robots.txt {
        root /var/www/auto-parts;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        root /var/www/auto-parts;
        try_files /sitemap.xml =404;
    }

    location = /b2b-preview {
        root /var/www/auto-parts;
        try_files /b2b-preview.html =404;
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache";
    }

    location ~ ^/[1-5]/?$ {
        root /var/www/auto-parts;
        try_files /themes.html =404;
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auto-parts.pp.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auto-parts.pp.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = auto-parts.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name auto-parts.pp.ua;
    return 404; # managed by Certbot


}
