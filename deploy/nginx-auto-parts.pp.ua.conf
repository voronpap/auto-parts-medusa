# Edge rate limiting. This file is included from the http{} context, so the
# zones can live here. Limits are per client IP; nginx answers 429 itself.
limit_req_zone $binary_remote_addr zone=ap_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ap_admin:10m rate=20r/s;

server {
    server_name auto-parts.pp.ua;

    client_max_body_size 25m;

    # No nginx version in headers and error pages.
    server_tokens off;

    # Security headers for the storefront and everything else. nginx drops
    # server-level add_header in a location that has its own add_header, so
    # such locations repeat this list (/admin/ keeps its stricter set).
    # HSTS has no includeSubDomains: www.auto-parts.pp.ua has no certificate.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;


    location = /robots.txt {
        root /var/www/auto-parts;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        root /var/www/auto-parts;
        try_files /sitemap.xml =404;
    }

    location = /b2b-preview {
        root /var/www/auto-parts;
        try_files /b2b-preview.html =404;
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    }

    location ~ ^/[1-5]/?$ {
        root /var/www/auto-parts;
        try_files /themes.html =404;
        add_header X-Robots-Tag "noindex, nofollow";
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;
    }

    # Login, token and session endpoints: brute-force protection.
    location ^~ /auth/ {
        limit_req zone=ap_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Admin API. Medusa rejects unauthenticated requests before the security
    # middleware runs, so the headers and the limit are enforced here instead.
    location ^~ /admin/ {
        limit_req zone=ap_admin burst=40 nodelay;
        limit_req_status 429;

        proxy_hide_header X-Request-ID;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "base-uri 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Remaining Medusa paths: admin dashboard, store API, health, files, webhooks.
    location ~ ^/(app|store|health|static|hooks)(/|$) {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Everything else is the Next.js storefront. It forwards X-Real-IP to the
    # backend on writes, so the header must always be overwritten here.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_hide_header X-Powered-By;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next builds redirect URLs from its own listen address.
        proxy_redirect http://localhost:8000/ /;
        proxy_redirect https://localhost:8000/ /;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/auto-parts.pp.ua/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/auto-parts.pp.ua/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = auto-parts.pp.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name auto-parts.pp.ua;
    return 404; # managed by Certbot


}
